[project]
name = "gnn-antifraud"
version = "0.1.0"
description = "Research pipeline for GNN-based fraud detection with calibration and XAI"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.5.0,<3.0",
    "lightgbm>=4.0.0",
    "scikit-learn>=1.3.0",
    "shap>=0.43.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "mlflow>=2.9.0",
    "notebook>=7.0.0",
    "igraph>=0.11.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.13.0",
    "tqdm>=4.66.0",
    "networkx>=3.1.0",
    "scipy>=1.11.0",
    "scikit-survival>=0.22.0",
    "statsmodels>=0.14.0",
]

[project.optional-dependencies]
gcn = [
    "torch-geometric>=2.5.0",
    "torch-scatter>=2.1.0",
    "torch-sparse>=0.6.10",
    "torch-cluster>=1.6.0",
    "torch-spline-conv>=1.2.0",
]
gpu = [
    "torch-cu121>=2.5.0",
]


[build-system]

requires = ["hatchling"]
build-backend = "hatchling.build"
