[project]
name = "phase01-lightgbm-baseline"
version = "0.1.0"
description = "LightGBM baseline for fraud detection with graph-derived features"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "lightgbm>=4.0.0",
    "networkx>=3.0",
    "python-louvain>=0.16",
    "scikit-learn>=1.3.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "jupyter>=1.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/phase01_lightgbm_baseline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
